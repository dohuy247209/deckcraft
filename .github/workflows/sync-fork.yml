name: Sync Fork

on:
  schedule:
    - cron: '0 0 * * *'   # chạy mỗi 6 giờ
  workflow_dispatch:         # cho phép chạy thủ công

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork với upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo sync ${{ github.repository }} \
            --source storytold/deckcraft \
            --branch main
